services:
  - type: web
    name: markdown-mash
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: GUEST_TRIAL_JWT_SECRET
        generateValue: true
      - key: GUEST_TRIAL_ENABLED
        value: "true"
      - key: GUEST_TRIAL_TTL_MINUTES
        value: "20"
      - key: GUEST_TRIAL_MAX_PARTICIPANTS
        value: "8"
      - key: GUEST_TRIAL_MAX_CONCURRENT
        value: "25"
      - key: GUEST_TRIAL_STARTS_PER_IP_HOUR
        value: "5"
      - key: HOSTED_MODE
        value: "true"
      - key: HOSTED_MAX_PARTICIPANTS
        value: "50"
      - key: HOSTED_INVITE_TTL_HOURS
        value: "72"
      - key: STRIPE_BILLING_ENABLED
        value: "false"
